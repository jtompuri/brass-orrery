<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brass Orrery</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23d8b25a'/%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23d8b25a' stroke-width='1.5'/%3E%3Ccircle cx='28' cy='16' r='2.5' fill='%23d8b25a'/%3E%3C/svg%3E">
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0b0b0d; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  #orrery-panel {
    position: fixed; top: 16px; left: 16px; width: 268px;
    background: rgba(13, 15, 19, 0.86);
    border: 1px solid rgba(216, 178, 90, 0.30);
    border-radius: 12px;
    padding: 14px 16px 12px;
    color: #e9e2cf;
    box-shadow: 0 12px 44px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    user-select: none;
    z-index: 10;
  }
  .panel-title {
    font-size: 15px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #e6c877; text-align:center; margin-bottom: 10px;
    border-bottom: 1px solid rgba(216,178,90,0.25); padding-bottom: 8px;
  }
  .panel-title small { display:block; font-size: 9px; letter-spacing:0.3em; color:#9d917a; margin-top:3px; }
  .row { display:flex; gap:8px; margin-bottom: 10px; }
  .btn {
    flex:1; background: linear-gradient(180deg, #2b2e35, #191b20);
    color:#e9e2cf; border:1px solid rgba(216,178,90,0.45);
    padding:7px 8px; border-radius:8px; cursor:pointer;
    font-family:inherit; font-size:12.5px; letter-spacing:0.06em;
    transition: all 0.15s ease;
  }
  .btn:hover { border-color: rgba(232, 200, 119, 0.8); color:#f6ead0; }
  .btn:active { transform: translateY(1px); }
  .btn.active { background: linear-gradient(180deg, #d9b45e, #96752c); color:#171307; border-color:#e6c877; font-weight:bold; }
  .lbl { display:flex; justify-content:space-between; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:#b9ae92; margin: 8px 0 4px; }
  .lbl span { color:#e6c877; font-variant-numeric: tabular-nums; }
  input[type=range] { width:100%; accent-color:#d8b25a; height: 18px; cursor: pointer; margin: 0 0 2px; }
  #orrery-readout {
    margin-top: 10px; padding: 7px 9px; text-align:center;
    font-size: 12.5px; color:#f2e8cd; letter-spacing:0.04em;
    background: rgba(216,178,90,0.08); border: 1px solid rgba(216,178,90,0.20);
    border-radius: 8px; font-variant-numeric: tabular-nums;
  }
  #orrery-label {
    margin-top: 9px; padding: 9px 10px;
    border-top: 1px solid rgba(216,178,90,0.25);
    font-size: 12px; line-height: 1.5;
  }
  #orrery-label.hidden { display:none; }
  #orrery-label .name { font-size: 16px; color:#e6c877; letter-spacing:0.12em; text-transform:uppercase; }
  #orrery-label .detail { color:#cfc6ac; font-size: 11.5px; }
  .hint {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 0.08em; color: rgba(233,226,207,0.45);
    background: rgba(13,15,19,0.55); padding: 5px 12px; border-radius: 20px;
    border: 1px solid rgba(216,178,90,0.15); pointer-events:none; white-space: nowrap;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="orrery-panel">
  <div class="panel-title">Brass Orrery<small>six planets · one drive</small></div>
  <div class="row">
    <button id="orrery-play" class="btn">Pause</button>
    <button id="orrery-reverse" class="btn">Reverse</button>
  </div>
  <div class="lbl"><span>Speed</span><span id="orrery-speed-val">2.0×</span></div>
  <input id="orrery-speed" type="range" min="0" max="100" step="0.5" value="42.86">
  <div class="lbl"><span>Section cutaway</span><span id="orrery-section-val">0%</span></div>
  <input id="orrery-section" type="range" min="0" max="100" step="1" value="0">
  <div id="orrery-readout">Turns 0.00 · Earth years 0.00</div>
  <div id="orrery-label" class="hidden"></div>
</div>
<div class="hint">Drag to orbit · Scroll to zoom · Drag the crank knob · Click a planet to trace</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  // ============================== CONFIG (exact from SPEC.md) ==============================
  var M = 0.02;                 // gear module
  var GEAR_THICK = 0.07;
  var DRIVE_PER_SEC = 2 * Math.PI / 88;   // at 1x
  var ANGLES_DEG = [30, 90, 150, 210, 270, 330];
  var LAYERS = [
    { name:'Mercury', driveTeeth:132, tubeTeeth:12,  gearY:0.45, tubeIn:0.04, tubeOut:0.06, armY:1.62, orbitR:0.75, planetR:0.05, armOffset:20,  period:87.969,  tex:'mercury' },
    { name:'Venus',   driveTeeth:117, tubeTeeth:27,  gearY:0.59, tubeIn:0.07, tubeOut:0.09, armY:1.57, orbitR:1.10, planetR:0.085, armOffset:135, period:224.701, tex:'venus' },
    { name:'Earth',   driveTeeth:105, tubeTeeth:39,  gearY:0.73, tubeIn:0.10, tubeOut:0.12, armY:1.52, orbitR:1.50, planetR:0.09, armOffset:250, period:365.256, tex:'earth' },
    { name:'Mars',    driveTeeth:84,  tubeTeeth:60,  gearY:0.87, tubeIn:0.13, tubeOut:0.15, armY:1.47, orbitR:1.90, planetR:0.07, armOffset:320, period:686.980, tex:'mars' },
    { name:'Jupiter', driveTeeth:26,  tubeTeeth:118, gearY:1.01, tubeIn:0.16, tubeOut:0.18, armY:1.42, orbitR:2.50, planetR:0.19, armOffset:75,  period:4332.59, tex:'jupiter' },
    { name:'Saturn',  driveTeeth:12,  tubeTeeth:132, gearY:1.15, tubeIn:0.19, tubeOut:0.21, armY:1.37, orbitR:3.15, planetR:0.16, armOffset:200, period:10759.22, tex:'saturn' }
  ];
  var ORBIT_Y = 2.15, SUN_R = 0.38, DRIVE_X = -1.44;

  // ============================== UTILITIES ==============================
  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function wrapPi(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }

  // ============================== RENDERER / SCENE ==============================
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.localClippingEnabled = true;
  document.getElementById('app').appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0b0d);
  scene.fog = new THREE.Fog(0x0b0b0d, 20, 46);

  var camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 120);

  // environment map (procedural studio softboxes)
  function makeEnvCanvas() {
    var c = document.createElement('canvas'); c.width = 1024; c.height = 512;
    var g = c.getContext('2d');
    var grad = g.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0.0, '#3a3e46');
    grad.addColorStop(0.45, '#191b20');
    grad.addColorStop(0.62, '#413420');
    grad.addColorStop(0.80, '#0e0c0a');
    grad.addColorStop(1.0, '#080808');
    g.fillStyle = grad; g.fillRect(0, 0, 1024, 512);
    // softbox blobs
    function blob(x, y, r, col, alpha) {
      var rg = g.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, 'rgba(' + col + ',' + alpha + ')');
      rg.addColorStop(1, 'rgba(' + col + ',0)');
      g.fillStyle = rg; g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    blob(200, 120, 150, '255,244,220', 0.95);
    blob(620, 90, 110, '255,244,220', 0.85);
    blob(880, 150, 90, '230,240,255', 0.7);
    blob(90, 240, 80, '255,230,190', 0.5);
    blob(500, 300, 260, '190,140,70', 0.28);
    return c;
  }
  var pmrem = new THREE.PMREMGenerator(renderer);
  var envTex = new THREE.CanvasTexture(makeEnvCanvas());
  envTex.mapping = THREE.EquirectangularReflectionMapping;
  var envMap = pmrem.fromEquirectangular(envTex).texture;
  scene.environment = envMap;

  // ============================== LIGHTS ==============================
  var hemi = new THREE.HemisphereLight(0x8a93a8, 0x1a120c, 0.05);
  scene.add(hemi);

  var key = new THREE.SpotLight(0xfff1dd, 1.55, 40, 0.62, 0.45, 1.2);
  key.position.set(6, 11, 4);
  key.target.position.set(0, 0.8, 0);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.bias = -0.0006;
  key.shadow.camera.near = 4; key.shadow.camera.far = 30;
  scene.add(key);
  scene.add(key.target);

  var fill = new THREE.DirectionalLight(0x9db4ff, 0.06);
  fill.position.set(-6, 5, -7);
  scene.add(fill);

  var sunLight = new THREE.PointLight(0xffc37a, 0.5, 7.5, 2);
  sunLight.position.set(0, ORBIT_Y, 0);
  scene.add(sunLight);

  // ============================== CLIPPING (section cutaway) ==============================
  var clipPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 5);
  function addClip(mat) { mat.clippingPlanes = [clipPlane]; mat.clipShadows = true; return mat; }

  // ============================== TEXTURE BUILDERS ==============================
  function makeWoodTexture() {
    var c = document.createElement('canvas'); c.width = c.height = 512;
    var g = c.getContext('2d');
    g.fillStyle = '#33200f'; g.fillRect(0, 0, 512, 512);
    var r = mulberry32(99);
    for (var i = 0; i < 110; i++) {
      var y = r() * 512;
      var dark = r() < 0.6;
      var col = dark ? 'rgba(24,14,7,' : 'rgba(88,54,28,';
      var a = 0.18 + r() * 0.35;
      g.strokeStyle = col + a + ')';
      g.lineWidth = 1 + r() * 3.5;
      g.beginPath();
      for (var x = 0; x <= 512; x += 8) {
        var yy = y + Math.sin(x * 0.018 + i * 1.7) * 5 + Math.sin(x * 0.05 + i) * 1.5;
        if (x === 0) g.moveTo(x, yy); else g.lineTo(x, yy);
      }
      g.stroke();
    }
    // subtle speckle
    for (var j = 0; j < 400; j++) {
      var x2 = r() * 512, y2 = r() * 512;
      g.fillStyle = 'rgba(' + (20 + r() * 60 | 0) + ',' + (12 + r() * 32 | 0) + ',8,0.12)';
      g.fillRect(x2, y2, 2, 1);
    }
    var tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function makeSunTexture() {
    var c = document.createElement('canvas'); c.width = c.height = 256;
    var g = c.getContext('2d');
    var rg = g.createRadialGradient(128, 128, 10, 128, 128, 128);
    rg.addColorStop(0, '#fff6d8');
    rg.addColorStop(0.45, '#ffd97a');
    rg.addColorStop(0.8, '#e8833a');
    rg.addColorStop(1, '#c2541e');
    g.fillStyle = rg; g.fillRect(0, 0, 256, 256);
    var r = mulberry32(7);
    for (var i = 0; i < 60; i++) {
      var x = r() * 256, y = r() * 256, rad = 3 + r() * 14;
      var b = g.createRadialGradient(x, y, 0, x, y, rad);
      b.addColorStop(0, 'rgba(255,240,200,' + (0.12 + r() * 0.2) + ')');
      b.addColorStop(1, 'rgba(255,240,200,0)');
      g.fillStyle = b; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    }
    var tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function makeHaloTexture() {
    var c = document.createElement('canvas'); c.width = c.height = 128;
    var g = c.getContext('2d');
    var rg = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    rg.addColorStop(0, 'rgba(255,225,160,0.9)');
    rg.addColorStop(0.35, 'rgba(255,200,110,0.35)');
    rg.addColorStop(1, 'rgba(255,190,100,0)');
    g.fillStyle = rg; g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }

  function makePlanetTexture(kind) {
    var c = document.createElement('canvas'); c.width = 512; c.height = 256;
    var g = c.getContext('2d');
    var r = mulberry32({ mercury: 31, venus: 47, earth: 53, mars: 67, jupiter: 71, saturn: 83 }[kind] || 99);
    function band(y, h, color) { g.fillStyle = color; g.fillRect(0, y, 512, h); }
    if (kind === 'mercury') {
      band(0, 256, '#8a8578');
      for (var i = 0; i < 900; i++) {
        var x = r() * 512, y = r() * 256, rad = 0.5 + r() * 3;
        g.fillStyle = r() < 0.5 ? 'rgba(70,66,58,' + (0.25 + r() * 0.4) + ')' : 'rgba(170,164,150,' + (0.25 + r() * 0.4) + ')';
        g.beginPath(); g.arc(x, y, rad, 0, 7); g.fill();
      }
    } else if (kind === 'venus') {
      band(0, 256, '#d6b483');
      for (var i = 0; i < 46; i++) {
        var y2 = r() * 256;
        g.strokeStyle = r() < 0.5 ? 'rgba(232,211,174,0.5)' : 'rgba(190,158,110,0.5)';
        g.lineWidth = 6 + r() * 14; g.beginPath();
        for (var x = 0; x <= 512; x += 10) {
          var yy = y2 + Math.sin(x * 0.02 + i) * 9;
          if (x === 0) g.moveTo(x, yy); else g.lineTo(x, yy);
        }
        g.stroke();
      }
    } else if (kind === 'earth') {
      band(0, 256, '#27557f');
      for (var i = 0; i < 14; i++) {
        var cx = r() * 512, cy = 40 + r() * 176, rad = 14 + r() * 42;
        g.fillStyle = r() < 0.55 ? 'rgba(74,106,72,0.95)' : 'rgba(122,96,60,0.95)';
        g.beginPath();
        for (var a = 0; a <= 7; a += 0.5) {
          var rr = rad * (0.6 + 0.4 * Math.sin(a * 3 + i * 2));
          var px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr * 0.6;
          if (a === 0) g.moveTo(px, py); else g.lineTo(px, py);
        }
        g.closePath(); g.fill();
      }
      g.fillStyle = 'rgba(240,244,248,0.92)';
      g.fillRect(0, 0, 512, 14); g.fillRect(0, 242, 512, 14);
      for (var i2 = 0; i2 < 26; i2++) {
        var cx2 = r() * 512, cy2 = r() * 256;
        g.strokeStyle = 'rgba(245,248,252,' + (0.25 + r() * 0.35) + ')'; g.lineWidth = 4 + r() * 8;
        g.beginPath(); g.moveTo(cx2 - 30, cy2); g.quadraticCurveTo(cx2, cy2 - 8 - r() * 8, cx2 + 30, cy2); g.stroke();
      }
    } else if (kind === 'mars') {
      band(0, 256, '#a14d26');
      for (var i = 0; i < 22; i++) {
        var y3 = r() * 256;
        g.strokeStyle = 'rgba(84,38,18,' + (0.25 + r() * 0.35) + ')'; g.lineWidth = 4 + r() * 12;
        g.beginPath(); g.moveTo(0, y3);
        for (var x3 = 0; x3 <= 512; x3 += 16) g.lineTo(x3, y3 + Math.sin(x3 * 0.02 + i) * 7);
        g.stroke();
      }
      for (var i4 = 0; i4 < 30; i4++) {
        var cx4 = r() * 512, cy4 = 60 + r() * 140, rad4 = 3 + r() * 10;
        g.fillStyle = 'rgba(214,120,74,0.5)';
        g.beginPath(); g.arc(cx4, cy4, rad4, 0, 7); g.fill();
      }
      g.fillStyle = 'rgba(238,226,212,0.95)';
      g.fillRect(0, 0, 512, 12);
    } else if (kind === 'jupiter' || kind === 'saturn') {
      var cols = kind === 'jupiter'
        ? ['#d9c39a', '#b5855a', '#e5d3ae', '#8a5f42', '#c99a6a', '#efe0c0', '#7a5338']
        : ['#ded2a8', '#c9b183', '#e8dcc0', '#b39a6b', '#dcc9a2'];
      var y = 0, i5 = 0;
      while (y < 256) {
        var bh = 10 + r() * 26;
        band(y, bh + 2, cols[i5 % cols.length]);
        y += bh; i5++;
      }
      // wavy edge softening
      for (var i6 = 0; i6 < 40; i6++) {
        var cx6 = r() * 512, cy6 = r() * 256;
        g.strokeStyle = 'rgba(90,60,35,' + (0.08 + r() * 0.12) + ')'; g.lineWidth = 2 + r() * 5;
        g.beginPath();
        for (var x6 = -40; x6 <= 552; x6 += 20) g.lineTo(x6, cy6 + Math.sin(x6 * 0.02 + i6) * 6);
        g.stroke();
      }
      if (kind === 'jupiter') {
        // great red spot
        var sx = 330, sy = 150;
        g.fillStyle = 'rgba(204,96,52,0.85)';
        g.beginPath(); g.ellipse(sx, sy, 30, 16, 0, 0, 7); g.fill();
        g.fillStyle = 'rgba(230,140,86,0.9)';
        g.beginPath(); g.ellipse(sx, sy, 16, 8, 0, 0, 7); g.fill();
      }
    }
    var tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function makeRingTexture() {
    var c = document.createElement('canvas'); c.width = c.height = 512;
    var g = c.getContext('2d');
    // planar UV: world radius 0.30 -> 256px, 0.21 -> 179px
    var r = mulberry32(101);
    var cx = 256, cy = 256;
    for (var rad = 179; rad <= 256; rad += 2) {
      var t = (rad - 179) / (256 - 179);
      var hue = 30 + r() * 10, lum = 42 + r() * 34;
      g.strokeStyle = 'hsl(' + hue + ',32%,' + lum + '%)';
      g.lineWidth = 2.4;
      g.beginPath(); g.arc(cx, cy, rad, 0, Math.PI * 2); g.stroke();
    }
    // dark gap bands
    [205, 232, 246].forEach(function (rad) {
      g.strokeStyle = 'rgba(30,22,14,0.85)'; g.lineWidth = 3;
      g.beginPath(); g.arc(cx, cy, rad, 0, Math.PI * 2); g.stroke();
    });
    var tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  // ============================== MATERIALS ==============================
  function brass(roughness) {
    return new THREE.MeshStandardMaterial({
      color: 0xe0aa3e, metalness: 1.0, roughness: roughness,
      envMapIntensity: 0.85
    });
  }
  var woodTex = makeWoodTexture();
  var woodMat = new THREE.MeshStandardMaterial({ map: woodTex, color: 0x7d5a3c, roughness: 0.5, metalness: 0.08, envMapIntensity: 0.45 });
  var trimMat = brass(0.22);
  var plateMat = addClip(brass(0.38));
  var bevelMat = addClip(brass(0.30));
  var domeMat = addClip(new THREE.MeshPhysicalMaterial({
    color: 0xffffff, transparent: true, opacity: 0.13,
    roughness: 0.06, metalness: 0.0, clearcoat: 1.0, clearcoatRoughness: 0.08,
    envMapIntensity: 1.1, side: THREE.DoubleSide, depthWrite: false
  }));
  var pillarMat = brass(0.34);
  var postMat = brass(0.32);
  var shaftMat = brass(0.30);

  // ============================== STATIC STRUCTURE ==============================
  var root = new THREE.Group();
  scene.add(root);

  // ground
  var ground = new THREE.Mesh(
    new THREE.CircleGeometry(46, 64),
    new THREE.MeshStandardMaterial({ color: 0x0e0d10, roughness: 0.96, metalness: 0.0 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.36;
  ground.receiveShadow = true;
  scene.add(ground);

  // base: wood + brass trim
  var wood = new THREE.Mesh(new THREE.CylinderGeometry(4.25, 4.25, 0.35, 96), woodMat);
  wood.position.y = -0.175;
  wood.castShadow = true; wood.receiveShadow = true;
  root.add(wood);

  var trimPts = [
    new THREE.Vector2(4.24, -0.02), new THREE.Vector2(4.35, -0.02),
    new THREE.Vector2(4.35, 0.02), new THREE.Vector2(4.24, 0.02)
  ];
  var trim = new THREE.Mesh(new THREE.LatheGeometry(trimPts, 96), trimMat);
  trim.castShadow = true; trim.receiveShadow = true;
  root.add(trim);

  // pillars
  ANGLES_DEG.forEach(function (deg) {
    var a = deg * Math.PI / 180;
    var p = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.25, 20), pillarMat);
    p.position.set(2.92 * Math.cos(a), 0.625, 2.92 * Math.sin(a));
    p.castShadow = true; p.receiveShadow = true;
    root.add(p);
  });

  // fixed central post
  var post = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.77, 16), postMat);
  post.position.y = 0.885;
  post.castShadow = true;
  root.add(post);

  // dome
  var dome = new THREE.Mesh(
    new THREE.SphereGeometry(4.20, 96, 48, 0, Math.PI * 2, 0, Math.PI / 2),
    domeMat
  );
  dome.position.y = 0;
  root.add(dome);

  // plates (open frame)
  function buildPlate(y0, thickness) {
    var g = new THREE.Group();
    // rim annulus
    var rim = new THREE.Shape();
    rim.absarc(0, 0, 3.00, 0, Math.PI * 2, false);
    var rimHole = new THREE.Path(); rimHole.absarc(0, 0, 2.80, 0, Math.PI * 2, true);
    rim.holes.push(rimHole);
    var rimGeo = new THREE.ExtrudeGeometry(rim, { depth: thickness, bevelEnabled: false, curveSegments: 96 });
    rimGeo.rotateX(-Math.PI / 2); rimGeo.translate(0, y0, 0);
    var rimMesh = new THREE.Mesh(rimGeo, plateMat);
    rimMesh.castShadow = true; rimMesh.receiveShadow = true;
    g.add(rimMesh);
    // center bearing
    var cb = new THREE.Shape();
    cb.absarc(0, 0, 0.42, 0, Math.PI * 2, false);
    var cbHole = new THREE.Path(); cbHole.absarc(0, 0, 0.24, 0, Math.PI * 2, true);
    cb.holes.push(cbHole);
    var cbGeo = new THREE.ExtrudeGeometry(cb, { depth: thickness, bevelEnabled: false, curveSegments: 48 });
    cbGeo.rotateX(-Math.PI / 2); cbGeo.translate(0, y0, 0);
    var cbMesh = new THREE.Mesh(cbGeo, plateMat);
    cbMesh.castShadow = true; cbMesh.receiveShadow = true;
    g.add(cbMesh);
    // drive bearing (centered at drive shaft)
    var db = new THREE.Shape();
    db.absarc(0, 0, 0.17, 0, Math.PI * 2, false);
    var dbHole = new THREE.Path(); dbHole.absarc(0, 0, 0.09, 0, Math.PI * 2, true);
    db.holes.push(dbHole);
    var dbGeo = new THREE.ExtrudeGeometry(db, { depth: thickness, bevelEnabled: false, curveSegments: 32 });
    dbGeo.rotateX(-Math.PI / 2); dbGeo.translate(0, y0, 0);
    var dbMesh = new THREE.Mesh(dbGeo, plateMat);
    dbMesh.position.x = DRIVE_X;
    dbMesh.castShadow = true; dbMesh.receiveShadow = true;
    g.add(dbMesh);
    // spokes (recessed slightly)
    var spokeMat = plateMat;
    ANGLES_DEG.forEach(function (deg) {
      var a = deg * Math.PI / 180;
      var len = 2.82 - 0.40;
      var spoke = new THREE.Mesh(new THREE.BoxGeometry(len, thickness - 0.012, 0.10), spokeMat);
      spoke.rotation.y = -a;
      var rm = (0.40 + 2.82) / 2;
      spoke.position.set(rm * Math.cos(a), y0 + (thickness - 0.012) / 2, rm * Math.sin(a));
      spoke.castShadow = true; spoke.receiveShadow = true;
      g.add(spoke);
    });
    // drive bar: two segments, recessed
    [[-0.40, -1.29], [-1.59, -2.82]].forEach(function (seg) {
      var len = Math.abs(seg[1] - seg[0]);
      var bar = new THREE.Mesh(new THREE.BoxGeometry(len, thickness - 0.012, 0.10), plateMat);
      bar.position.set((seg[0] + seg[1]) / 2, y0 + (thickness - 0.012) / 2, 0);
      bar.castShadow = true; bar.receiveShadow = true;
      g.add(bar);
    });

  }
  root.add(buildPlate(0.375, 0.03));   // bottom plate: 0.375..0.405
  root.add(buildPlate(1.25, 0.04));    // top plate: 1.25..1.29

  // ============================== GEAR GEOMETRY ==============================
  function buildGearGeometry(teeth, thickness, withCutouts) {
    var pitchStep = 2 * Math.PI / teeth;
    var rPitch = M * teeth / 2;
    var rTip = rPitch + 1.00 * M;
    var rRoot = rPitch - 1.25 * M;
    var halfPitch = 0.38 * pitchStep / 2;
    var halfTip = 0.55 * halfPitch;
    var halfRoot = halfPitch + (halfPitch - halfTip) * 1.25;

    var shape = new THREE.Shape();
    for (var j = 0; j < teeth; j++) {
      var mid = pitchStep * j;
      var pts = [
        [rRoot, mid - halfRoot], [rPitch, mid - halfPitch], [rTip, mid - halfTip],
        [rTip, mid + halfTip], [rPitch, mid + halfPitch], [rRoot, mid + halfRoot]
      ];
      for (var k = 0; k < pts.length; k++) {
        var x = Math.cos(pts[k][1]) * pts[k][0];
        var y = Math.sin(pts[k][1]) * pts[k][0];
        if (j === 0 && k === 0) shape.moveTo(x, y); else shape.lineTo(x, y);
      }
      shape.absarc(0, 0, rRoot, mid + halfRoot, mid + pitchStep - halfRoot, false);
    }
    if (withCutouts && teeth >= 60) {
      var hubR = rPitch * 0.24;
      var outerBound = rRoot - 0.18;
      var holeCenter = (hubR + outerBound) / 2;
      var holeR = (outerBound - hubR) / 2;
      var n = teeth >= 100 ? 5 : 4;
      for (var i = 0; i < n; i++) {
        var a = (i / n) * 2 * Math.PI + Math.PI / n;
        var hole = new THREE.Path();
        hole.absarc(Math.cos(a) * holeCenter, Math.sin(a) * holeCenter, holeR, 0, Math.PI * 2, true);
        shape.holes.push(hole);
      }
    }
    var geo = new THREE.ExtrudeGeometry(shape, { depth: thickness, bevelEnabled: false, curveSegments: 8 });
    geo.rotateX(-Math.PI / 2);
    geo.translate(0, -thickness / 2, 0);
    return geo;
  }

  // ============================== SUN ==============================
  var sunTex = makeSunTexture();
  var sunMat = new THREE.MeshStandardMaterial({
    map: sunTex, emissive: 0xffb050, emissiveMap: sunTex,
    emissiveIntensity: 0.95, roughness: 0.7, metalness: 0.0
  });
  var sun = new THREE.Mesh(new THREE.SphereGeometry(SUN_R, 64, 48), sunMat);
  sun.position.set(0, ORBIT_Y, 0);
  root.add(sun);

  var halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: makeHaloTexture(), transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false, color: 0xffc97e
  }));
  halo.scale.set(2.6, 2.6, 1);
  halo.position.set(0, ORBIT_Y, 0);
  root.add(halo);

  // ============================== ORBITS ==============================
  var ribbonMat = new THREE.MeshBasicMaterial({ color: 0xc8a24d, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false });
  LAYERS.forEach(function (L) {
    var g = new THREE.RingGeometry(L.orbitR - 0.012, L.orbitR + 0.012, 160);
    g.rotateX(-Math.PI / 2);
    var ribbon = new THREE.Mesh(g, ribbonMat);
    ribbon.position.y = ORBIT_Y;
    root.add(ribbon);
  });

  // ============================== PER-LAYER MECHANISMS ==============================
  var layers = [];
  var knobTargets = [];
  var planetTargets = [];

  LAYERS.forEach(function (L, idx) {
    var layer = { def: L, idx: idx, mats: [], meshes: [], planets: [] };
    var tubeBrass = brass(0.40);   // tube/collar/hub/arm/riser
    var gearMat = addClip(brass(0.30));
    var planetMat = new THREE.MeshStandardMaterial({
      map: makePlanetTexture(L.tex), roughness: 0.82, metalness: 0.0, envMapIntensity: 0.35
    });
    layer.mats.push(tubeBrass, gearMat, planetMat);

    // -- assembled content rotating about central axis --
    var asm = new THREE.Group();
    root.add(asm);

    // tube gear
    var tubeGear = new THREE.Mesh(buildGearGeometry(L.tubeTeeth, GEAR_THICK, true), gearMat);
    tubeGear.position.set(0, L.gearY, 0);
    tubeGear.castShadow = true; tubeGear.receiveShadow = true;
    asm.add(tubeGear);

    // nested tube (annular extrusion) from gearY to armY
    var tubeShape = new THREE.Shape();
    tubeShape.absarc(0, 0, L.tubeOut, 0, Math.PI * 2, false);
    var tubeHole = new THREE.Path(); tubeHole.absarc(0, 0, L.tubeIn, 0, Math.PI * 2, true);
    tubeShape.holes.push(tubeHole);
    var tubeGeo = new THREE.ExtrudeGeometry(tubeShape, { depth: L.armY - L.gearY, bevelEnabled: false, curveSegments: 40 });
    tubeGeo.rotateX(-Math.PI / 2);
    tubeGeo.translate(0, L.gearY, 0);
    var tube = new THREE.Mesh(tubeGeo, tubeBrass);
    tube.castShadow = true;
    asm.add(tube);

    // collar
    var collar = new THREE.Mesh(new THREE.CylinderGeometry(L.tubeOut + 0.015, L.tubeOut + 0.015, 0.05, 32), tubeBrass);
    collar.position.set(0, L.armY - 0.045, 0);
    collar.castShadow = true;
    asm.add(collar);

    // hub (proud of the arm bar)
    var hub = new THREE.Mesh(new THREE.CylinderGeometry(L.tubeOut + 0.02, L.tubeOut + 0.02, 0.030, 32), tubeBrass);
    hub.position.set(0, L.armY, 0);
    hub.castShadow = true;
    asm.add(hub);

    // arm group rotated about Y so its reference direction points at armOffset
    var armGroup = new THREE.Group();
    armGroup.rotation.y = -L.armOffset * Math.PI / 180;
    asm.add(armGroup);

    // arm: flat bar from hub to orbit radius, thickness 0.025, width 0.05
    var arm = new THREE.Mesh(new THREE.BoxGeometry(L.orbitR, 0.025, 0.05), tubeBrass);
    arm.position.set(L.orbitR / 2, L.armY, 0);
    arm.castShadow = true;
    armGroup.add(arm);

    // riser: vertical rod from arm tip to ORBIT_Y
    var riser = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, ORBIT_Y - L.armY, 10), tubeBrass);
    riser.position.set(L.orbitR, (L.armY + ORBIT_Y) / 2, 0);
    riser.castShadow = true;
    armGroup.add(riser);

    // planet
    var planet = new THREE.Mesh(new THREE.SphereGeometry(L.planetR, 40, 28), planetMat);
    planet.position.set(L.orbitR, ORBIT_Y, 0);
    planet.castShadow = true;
    planet.userData.layerIdx = idx;
    armGroup.add(planet);
    layer.planets.push(planet);
    planetTargets.push(planet);

    // Saturn ring
    if (L.name === 'Saturn') {
      var ringMat = new THREE.MeshStandardMaterial({
        map: makeRingTexture(), transparent: true, opacity: 0.92,
        roughness: 0.75, metalness: 0.08, side: THREE.DoubleSide
      });
      var ringGeo = new THREE.RingGeometry(0.21, 0.30, 96);
      ringGeo.rotateX(-Math.PI / 2 + 20 * Math.PI / 180);
      var ring = new THREE.Mesh(ringGeo, ringMat);
      ring.position.set(L.orbitR, ORBIT_Y, 0);
      ring.castShadow = true;
      armGroup.add(ring);
      layer.mats.push(ringMat);
      ring.userData.layerIdx = idx;
      planetTargets.push(ring);
    }

    // collect meshes for highlight/dim
    asm.traverse(function (o) { if (o.isMesh) layer.meshes.push(o); });
    layer.meshMats = [tubeBrass, gearMat, planetMat];
    if (L.name === 'Saturn') layer.meshMats.push(layer.mats[3]);

    layer.asm = asm;
    layers.push(layer);
  });

  // ============================== DRIVE GROUP (shared shaft + per-layer gears) ==============================
  var driveGroup = new THREE.Group();
  driveGroup.position.set(DRIVE_X, 0, 0);
  root.add(driveGroup);

  var shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.97, 32), shaftMat);
  shaft.position.y = 0.785;   // 0.30..1.27
  shaft.castShadow = true;
  driveGroup.add(shaft);

  // bevel gear on the drive shaft (axis Y)
  var bevelGeoY = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.060, 0.07, 24), bevelMat);
  bevelGeoY.position.y = 0.30;
  bevelGeoY.castShadow = true;
  driveGroup.add(bevelGeoY);
  for (var bi = 0; bi < 12; bi++) {
    var bA = (bi / 12) * Math.PI * 2;
    var bT = new THREE.Mesh(new THREE.BoxGeometry(0.016, 0.05, 0.03), bevelMat);
    bT.position.set(0.058 * Math.cos(bA), 0.285, 0.058 * Math.sin(bA));
    bT.rotation.y = -bA;
    driveGroup.add(bT);
  }

  // drive gears (one per layer, shared group so everything rotates together)
  layers.forEach(function (layer) {
    var dg = new THREE.Mesh(buildGearGeometry(layer.def.driveTeeth, GEAR_THICK, layer.def.driveTeeth >= 60), layer.mats[1]);
    dg.position.set(0, layer.def.gearY, 0);
    dg.castShadow = true; dg.receiveShadow = true;
    driveGroup.add(dg);
    layer.driveMesh = dg;
    layer.meshes.push(dg);
  });

  // ============================== CRANK ==============================
  var crankGroup = new THREE.Group();
  crankGroup.position.set(DRIVE_X, 0.30, 0);
  root.add(crankGroup);

  // crank shaft (along -X, from x = -1.44 world to x = -3.70)
  var crankShaftGeo = new THREE.CylinderGeometry(0.055, 0.055, 2.26, 24);
  crankShaftGeo.rotateZ(Math.PI / 2);
  var crankShaft = new THREE.Mesh(crankShaftGeo, shaftMat);
  crankShaft.position.set(-1.13, 0, 0);
  crankShaft.castShadow = true;
  crankGroup.add(crankShaft);

  // bevel gear on crank shaft (axis X)
  var crankBevelGeo = new THREE.CylinderGeometry(0.035, 0.060, 0.07, 24);
  crankBevelGeo.rotateZ(-Math.PI / 2);   // axis along X
  var crankBevel = new THREE.Mesh(crankBevelGeo, bevelMat);
  crankBevel.position.set(0, 0, 0);
  crankBevel.castShadow = true;
  crankGroup.add(crankBevel);
  for (var ci = 0; ci < 12; ci++) {
    var cA = (ci / 12) * Math.PI * 2;
    var cT = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.016, 0.03), bevelMat);
    cT.position.set(0, 0.058 * Math.cos(cA), 0.058 * Math.sin(cA));
    cT.rotation.x = -cA;
    crankGroup.add(cT);
  }

  // crank arm + knob at the outer end (x = -3.70 world)
  var armMesh = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.28, 0.09), pillarMat);
  armMesh.position.set(-2.26, 0.11, 0);
  armMesh.castShadow = true;
  crankGroup.add(armMesh);
  knobTargets.push(armMesh);

  // turned wooden knob
  var knobPts = [
    new THREE.Vector2(0.006, 0.000), new THREE.Vector2(0.032, 0.002),
    new THREE.Vector2(0.042, 0.012), new THREE.Vector2(0.055, 0.045),
    new THREE.Vector2(0.058, 0.085), new THREE.Vector2(0.052, 0.115),
    new THREE.Vector2(0.042, 0.145), new THREE.Vector2(0.040, 0.165),
    new THREE.Vector2(0.030, 0.175), new THREE.Vector2(0.006, 0.180)
  ];
  var knob = new THREE.Mesh(new THREE.LatheGeometry(knobPts, 24),
    new THREE.MeshStandardMaterial({ color: 0x6b4226, roughness: 0.42, metalness: 0.05, envMapIntensity: 0.8 }));
  knob.geometry.rotateZ(Math.PI / 2);   // axis along -X
  knob.position.set(-2.26, 0.24, 0);
  knob.castShadow = true;
  crankGroup.add(knob);
  knobTargets.push(knob);

  // brass collar where crank arm meets knob
  var collarKnob = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.062, 0.03, 24), trimMat);
  collarKnob.geometry.rotateZ(Math.PI / 2);
  collarKnob.position.set(-2.27, 0.24, 0);
  crankGroup.add(collarKnob);

  // ============================== TRACE (click to highlight) ==============================
  function setLayerTrace(layer, state) {
    var traced = state === 'trace';
    var dimmed = state === 'dim';
    layer.meshes.forEach(function (m) { m.castShadow = !dimmed; });
    layer.meshMats.forEach(function (mat) {
      if (!mat.userData) mat.userData = {};
      if (mat.userData.orig === undefined) {
        mat.userData.orig = {
          opacity: mat.opacity, transparent: mat.transparent,
          emissive: mat.emissive ? mat.emissive.getHex() : 0,
          emissiveIntensity: mat.emissiveIntensity !== undefined ? mat.emissiveIntensity : 1
        };
      }
      var orig = mat.userData.orig;
      if (traced) {
        if (!mat.userData.dimmedOriginally) { mat.transparent = false; mat.opacity = orig.opacity; }
        if (mat.emissive) { mat.emissive.setHex(0x3a2a0e); mat.emissiveIntensity = 1.0; }
      } else if (dimmed) {
        mat.transparent = true; mat.opacity = 0.16;
        if (mat.emissive) mat.emissive.setHex(0x000000);
      } else {
        mat.transparent = orig.transparent; mat.opacity = orig.opacity;
        if (mat.emissive) { mat.emissive.setHex(orig.emissive); mat.emissiveIntensity = orig.emissiveIntensity; }
      }
      mat.needsUpdate = true;
    });
  }

  var traceIdx = -1;
  function applyTrace() {
    layers.forEach(function (layer, i) {
      setLayerTrace(layer, i === traceIdx ? 'trace' : (traceIdx === -1 ? 'none' : 'dim'));
    });
    var label = document.getElementById('orrery-label');
    if (traceIdx === -1) {
      label.classList.add('hidden');
      label.innerHTML = '';
      return;
    }
    var L = layers[traceIdx].def;
    var ratio = L.driveTeeth / L.tubeTeeth;
    label.classList.remove('hidden');
    label.innerHTML =
      '<div class="name">' + L.name + '</div>' +
      '<div class="detail">Drive gear: ' + L.driveTeeth + 'T &nbsp;·&nbsp; Tube gear: ' + L.tubeTeeth + 'T</div>' +
      '<div class="detail">Ratio: ' + ratio.toFixed(2) + ' : 1 &nbsp;·&nbsp; Period: ' + L.period.toFixed(3) + ' d</div>';
  }

  // ============================== STATE / INTERACTION ==============================
  var driveAngle = 0;         // THE one animated mechanical value
  var playing = true;
  var reversed = false;
  var speed = 2.0;
  var sectionT = 0;

  var playBtn = document.getElementById('orrery-play');
  var reverseBtn = document.getElementById('orrery-reverse');
  var speedInput = document.getElementById('orrery-speed');
  var speedVal = document.getElementById('orrery-speed-val');
  var sectionInput = document.getElementById('orrery-section');
  var sectionVal = document.getElementById('orrery-section-val');
  var readout = document.getElementById('orrery-readout');

  function sliderToSpeed(v) { return 0.25 * Math.pow(128, v / 100); }
  function speedToSlider(s) { return Math.log(s / 0.25) / Math.log(128) * 100; }

  playBtn.addEventListener('click', function () {
    playing = !playing;
    playBtn.textContent = playing ? 'Pause' : 'Play';
    playBtn.classList.toggle('active', !playing);
  });
  reverseBtn.addEventListener('click', function () {
    reversed = !reversed;
    reverseBtn.classList.toggle('active', reversed);
  });
  speedInput.addEventListener('input', function () {
    speed = sliderToSpeed(parseFloat(speedInput.value));
    speedVal.textContent = speed.toFixed(1) + '×';
  });
  sectionInput.addEventListener('input', function () {
    sectionT = parseFloat(sectionInput.value) / 100;
    sectionVal.textContent = sectionInput.value + '%';
    clipPlane.constant = 5.0 - 10.0 * sectionT;   // keep side: x <= constant
  });

  // camera control state
  var target = new THREE.Vector3(0, 1.35, 0);
  var radius = 10.8, elevation = 0.42, azimuth = 0.55;
  function updateCamera() {
    var horiz = radius * Math.cos(elevation);
    var y = target.y + radius * Math.sin(elevation);
    y = Math.max(y, 0.45);
    camera.position.set(target.x + horiz * Math.cos(azimuth), y, target.z + horiz * Math.sin(azimuth));
    camera.lookAt(target);
  }

  var dom = renderer.domElement;
  var raycaster = new THREE.Raycaster();
  var ndc = new THREE.Vector2();
  var pointers = new Map();
  var draggingCrank = false, draggingOrbit = false, pinching = false, orbitMoved = false;
  var downX = 0, downY = 0, lastPinchDist = 0;
  var prevGamma = null;
  var storedPlaying = null;
  var dragLastX = 0, dragLastY = 0;

  function setNDC(e) {
    var r = dom.getBoundingClientRect();
    ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  }
  function pickKnob(e) {
    setNDC(e);
    raycaster.setFromCamera(ndc, camera);
    var hits = raycaster.intersectObjects(knobTargets, false);
    return hits.length ? hits[0] : null;
  }
  function pickPlanet(e) {
    setNDC(e);
    raycaster.setFromCamera(ndc, camera);
    var hits = raycaster.intersectObjects(planetTargets, false);
    return hits.length ? hits[0].object : null;
  }

  dom.addEventListener('pointerdown', function (e) {
    dom.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      pinching = true; draggingOrbit = false; draggingCrank = false;
      var pts = Array.from(pointers.values());
      lastPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      return;
    }
    var knobHit = pickKnob(e);
    if (knobHit) {
      draggingOrbit = false;
      draggingCrank = true;
      storedPlaying = playing;
      playing = false;
      orbitMoved = true;
      // compute gamma from pointer ray vs plane x = knob plane
      var p = rayHitPlane(e);
      if (p) prevGamma = Math.atan2(p.z - 0, p.y - 0.30);
      dom.style.cursor = 'grabbing';
      return;
    }
    draggingOrbit = true; orbitMoved = false;
    downX = e.clientX; downY = e.clientY;
    dragLastX = e.clientX; dragLastY = e.clientY;
    pinching = false;
  });
  dom.addEventListener('pointermove', function (e) {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinching && pointers.size === 2) {
      var pts = Array.from(pointers.values());
      var d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (lastPinchDist > 0) radius = clamp(radius * Math.pow(lastPinchDist / d, 1.6), 3.5, 16);
      lastPinchDist = d;
      return;
    }
    if (draggingCrank) {
      var p = rayHitPlane(e);
      if (p && prevGamma !== null) {
        var gamma = Math.atan2(p.z - 0, p.y - 0.30);
        var delta = wrapPi(gamma - prevGamma);
        driveAngle += delta;
        prevGamma = gamma;
      }
      return;
    }
    if (draggingOrbit) {
      var dx = e.clientX - dragLastX, dy = e.clientY - dragLastY;
      dragLastX = e.clientX; dragLastY = e.clientY;
      if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 4) orbitMoved = true;
      azimuth += dx * 0.005;
      elevation = clamp(elevation + dy * 0.004, 0.12, 1.35);
      return;
    }
    // hover cursor
    if (pickKnob(e)) { dom.style.cursor = 'grab'; return; }
    if (pickPlanet(e)) { dom.style.cursor = 'pointer'; return; }
    dom.style.cursor = 'default';
  });
  dom.addEventListener('pointerup', function (e) {
    pointers.delete(e.pointerId);
    if (pinching) { if (pointers.size < 2) { pinching = false; lastPinchDist = 0; } return; }
    if (draggingCrank) {
      draggingCrank = false;
      prevGamma = null;
      if (storedPlaying !== null) playing = storedPlaying;
      storedPlaying = null;
      dom.style.cursor = 'grab';
      return;
    }
    if (draggingOrbit) {
      draggingOrbit = false;
      if (!orbitMoved) {
        var planet = pickPlanet(e);
        if (planet) {
          traceIdx = planet.userData.layerIdx;
          applyTrace();
        } else {
          traceIdx = -1;
          applyTrace();
        }
      }
      return;
    }
  });
  dom.addEventListener('pointercancel', function (e) {
    pointers.delete(e.pointerId);
    pinching = false; draggingOrbit = false;
    if (draggingCrank) { draggingCrank = false; prevGamma = null; playing = storedPlaying === null ? true : storedPlaying; storedPlaying = null; }
  });
  dom.addEventListener('wheel', function (e) {
    e.preventDefault();
    radius = clamp(radius * (1 + e.deltaY * 0.0038), 3.5, 16);
  }, { passive: false });

  function rayHitPlane(e) {
    setNDC(e);
    raycaster.setFromCamera(ndc, camera);
    var plane = new THREE.Plane(new THREE.Vector3(1, 0, 0), 3.70);   // x = -3.70
    var p = new THREE.Vector3();
    var hit = raycaster.ray.intersectPlane(plane, p);
    return hit ? p : null;
  }

  // ============================== ANIMATION ==============================
  var clock = new THREE.Clock();
  var realTime = 0;
  var lastPlayBtnText = '';

  function tick() {
    requestAnimationFrame(tick);
    var dt = Math.min(clock.getDelta(), 0.05);
    realTime += dt;

    if (playing) {
      var dir = reversed ? -1 : 1;
      driveAngle += DRIVE_PER_SEC * speed * dir * dt;
    }

    // mechanical value propagation
    driveGroup.rotation.y = -driveAngle;
    crankGroup.rotation.x = driveAngle;

    layers.forEach(function (layer) {
      var L = layer.def;
      var tubeAngle = -(L.driveTeeth / L.tubeTeeth) * driveAngle + (Math.PI - Math.PI / L.tubeTeeth);
      layer.asm.rotation.y = -tubeAngle;
    });

    // cosmetic surface motion (real time)
    sun.rotation.y = realTime * 0.05;
    layers.forEach(function (layer, i) {
      layer.planets.forEach(function (p) { p.rotation.y = realTime * (0.12 + i * 0.015); });
    });

    // readout
    var turns = driveAngle / (2 * Math.PI);
    var years = turns * (105 / 39);
    readout.textContent = 'Turns ' + turns.toFixed(2) + ' · Earth years ' + years.toFixed(2);

    updateCamera();
    renderer.render(scene, camera);
  }

  // ============================== RESIZE ==============================
  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // init
  window.__orrery = { scene: scene, camera: camera, layers: layers, driveAngleRef: function () { return driveAngle; }, speedRef: function () { return speed; } };
  speedInput.value = speedToSlider(2.0);
  speedVal.textContent = '2.0×';
  applyTrace();
  updateCamera();
  tick();
})();
</script>
</body>
</html>
